global:
  scrape_interval: 15s
  evaluation_interval: 10s
rule_files:
  - rules.yml
scrape_configs:
  - job_name: replicator
    static_configs:
      - targets: ["replicator:50111"]
  - job_name: couchdb
    static_configs:
      - targets: ["couchdb-exporter:9984"]
remote_write:
  - url: http://victoriametrics:8428/api/v1/write
